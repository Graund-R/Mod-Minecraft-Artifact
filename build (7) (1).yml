name: Build mod

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Pick newest source archive and version
        run: |
          set -e
          Z=$(ls | grep -E '^weaponmod-[0-9]+(\.[0-9]+)*\.zip$' | sort -V | tail -1)
          if [ -z "$Z" ]; then echo "No weaponmod-X.Y.zip found"; exit 1; fi
          VER=${Z#weaponmod-}
          VER=${VER%.zip}
          echo "Using $Z (version $VER)"
          echo "ZIP=$Z" >> "$GITHUB_ENV"
          echo "MODVER=$VER" >> "$GITHUB_ENV"

      - name: Prepare project (extract mod sources + Forge MDK)
        run: |
          set -e
          mkdir -p source
          unzip -q "$ZIP" -d source
          test -d source/src/main/java/weaponmod
          if [ ! -f mdk.zip ]; then
            curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-mdk.zip
          fi
          rm -rf mdk
          mkdir mdk
          unzip -q mdk.zip -d mdk
          rm -rf mdk/src
          cp -r source/src mdk/src
          cd mdk
          chmod +x gradlew
          sed -i 's#http://files.minecraftforge.net/maven#https://maven.minecraftforge.net#g' build.gradle
          sed -i 's#^archivesBaseName = .*#archivesBaseName = "weaponmod"#' build.gradle
          sed -i "s#^version = .*#version = \"$MODVER\"#" build.gradle
          sed -i -E "s/version\s*=\s*\"[0-9]+(\.[0-9]+)*\"/version = \"$MODVER\"/" src/main/java/weaponmod/WeaponMod.java

      - name: Build
        working-directory: mdk
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: weaponmod-${{ env.MODVER }}
          path: mdk/build/libs/*.jar

      - name: Publish GitHub Release (only for tags vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mdk/build/libs/weaponmod-*.jar \
            --title "Weapon Mod $MODVER" --generate-notes
